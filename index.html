<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seattle Weather</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Seattle Weather</h1>
        </header>
        
        <main id="weatherContent">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading weather data...</p>
            </div>
            
            <div class="weather-display" id="weatherDisplay" style="display: none;">
                <div class="weather-icon">
                    <img id="weatherIcon" src="" alt="Weather icon">
                </div>
                
                <div class="temperature">
                    <span id="temp" class="temp-value">--</span>
                    <span class="temp-unit">°F</span>
                </div>
                
                <div class="condition">
                    <p id="condition">--</p>
                </div>
                
                <div class="details">
                    <div class="detail-item">
                        <span class="detail-label">Humidity:</span>
                        <span id="humidity">--</span>%
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Wind:</span>
                        <span id="wind">--</span> mph
                    </div>
                </div>
                
                <button id="refreshBtn" class="refresh-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6M1 20v-6h6"/>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                    </svg>
                    Refresh
                </button>
            </div>
            
            <div class="error" id="error" style="display: none;">
                <div class="error-icon">⚠️</div>
                <p id="errorMessage">Unable to fetch weather data</p>
                <button id="retryBtn" class="retry-btn">Try Again</button>
            </div>
        </main>
        
        <footer>
            <p class="note">Weather data provided by OpenWeather API</p>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
